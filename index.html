<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pro - Control Asistencia</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">
    <!--
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    -->
     <script src="html5-qrcode.min.js"></script>
     <script src="xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-deep: #121212; 
            --bg-panel: #1e1e1e; 
            --primary-glow: #00ff88; 
            --error-glow: #ff0055;
            --info-glow: #00bfff; 
            --warning-glow: #ffaa00;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(5px);
            position: fixed;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin: 0;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 2px;
            margin-bottom: 10px;
        }

        /* --- BOTÓN DE CANDADO (ADMIN) --- */
        .admin-toggle-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .admin-toggle-btn.active {
            border-color: var(--warning-glow);
            color: var(--warning-glow);
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
        }

        input[type="file"] {
            display: none;
        }
        
        .custom-file-upload {
            border: 1px solid var(--info-glow);
            color: var(--info-glow);
            background-color: transparent;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .custom-file-upload:hover {
            background-color: rgba(0, 191, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.4);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin-top: 110px; 
            padding-bottom: 20px;
        }

        .scanner-wrapper {
            width: 90%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            background-color: var(--bg-panel);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            border: 2px solid #333;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .scanner-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 255, 136, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
            animation: scanningLine 2.5s infinite linear;
            z-index: 10;
        }

        @keyframes scanningLine {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        #reader {
            width: 100% !important;
            border: none !important;
            text-align: center;
        }
        
        #reader video {
            width: 100% !important;
            height: auto !important;
            object-fit: cover !important;
            display: block !important;
            margin: 0 auto !important;
            border-radius: 18px;
        }

        button[id*="html5-qrcode-button"] {
            background-color: var(--bg-deep) !important;
            color: var(--primary-glow) !important;
            border: 1px solid var(--primary-glow) !important;
            padding: 8px 15px !important;
            border-radius: 5px !important;
            cursor: pointer !important;
            text-transform: uppercase !important;
            font-size: 0.8em !important;
            margin: 10px auto !important;
        }

        .scanner-wrapper.success { box-shadow: 0 0 50px rgba(0, 255, 136, 0.6); border-color: var(--primary-glow); }
        .scanner-wrapper.error { box-shadow: 0 0 50px rgba(255, 0, 85, 0.6); border-color: var(--error-glow); }
        .scanner-wrapper.info { box-shadow: 0 0 50px rgba(0, 191, 255, 0.6); border-color: var(--info-glow); }

        .manual-box {
            width: 90%;
            max-width: 470px;
            background: var(--bg-panel);
            margin-top: 15px;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .manual-box input {
            flex: 1;
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 0.9em;
            outline: none;
            transition: border 0.3s;
        }

        .manual-box input:focus {
            border-color: var(--info-glow);
        }

        .manual-box button {
            background: transparent;
            border: 1px solid var(--info-glow);
            color: var(--info-glow);
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .manual-box button:hover {
            background: rgba(0, 191, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
        }

        #notification-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .toast {
            background-color: var(--bg-panel);
            color: var(--text-main);
            padding: 15px 25px;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: none;
            border-left: 5px solid transparent;
            min-width: 250px;
            font-weight: bold;
        }

        .toast.success { border-left-color: var(--primary-glow); }
        .toast.error { border-left-color: var(--error-glow); }
        .toast.info { border-left-color: var(--info-glow); }

        .results-container {
            width: 90%;
            max-width: 650px;
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            margin-top: 25px;
            overflow-x: auto;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            gap: 5px;
        }

        .results-header h3 {
            margin: 0;
            color: var(--text-muted);
            font-size: 1em;
            text-transform: uppercase;
            flex-grow: 1;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-download {
            background-color: transparent;
            border: 1px solid var(--primary-glow);
            color: var(--primary-glow);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            background-color: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .btn-clear-all {
            background-color: transparent;
            border: 1px solid var(--error-glow);
            color: var(--error-glow);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-clear-all:hover {
            background-color: rgba(255, 0, 85, 0.1);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        .btn-delete-row {
            background: transparent;
            border: none;
            color: var(--error-glow);
            cursor: pointer;
            font-size: 1.1em;
            padding: 2px 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }
        
        .btn-delete-row:hover {
            background: rgba(255, 0, 85, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }

        th {
            color: var(--text-muted);
            font-weight: normal;
            text-align: left;
            padding: 8px;
            white-space: nowrap;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid #2a2a2a;
        }

        td strong { color: var(--text-main); }
        tr:last-child td { border-bottom: none; }
        
        .tag-seccion {
            background: #333;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.85em;
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        /* --- CLASE CONTROLADORA DE PRIVACIDAD --- */
        .admin-only {
            display: none !important; /* Oculto por defecto */
        }
    </style>
</head>
<body>

    <header>
        <h2>Scanner Pro</h2>
        <div class="subtitle">Aprendiendo y registrando cada día</div>
        
        <button id="admin-btn" class="admin-toggle-btn" onclick="toggleAdminMode()">
            <span id="lock-icon">🔒</span> <span id="lock-text">Modo Kiosco</span>
        </button>

        <label for="excel-upload" class="custom-file-upload admin-only">
            <span id="btn-text">Cargar BD Personal (.xlsx)</span>
        </label>
        <input id="excel-upload" type="file" accept=".xlsx, .xls" />
    </header>

    <main>
        <div class="scanner-wrapper" id="scanner-visuals">
            <div id="reader"></div>
        </div>

        <div class="manual-box admin-only">
            <input type="text" id="manual-input" placeholder="Escribir ID manualmente y presionar Enter..." autocomplete="off">
            <button onclick="processManualInput()">Registrar</button>
        </div>

        <div class="results-container">
            <div class="results-header">
                <h3>Registros de Hoy</h3>
                <div class="action-buttons">
                    <button class="btn-clear-all admin-only" onclick="clearAllRecords()">Vaciar Todo</button>
                    <button class="btn-download" onclick="exportToExcel()">Descargar Reporte</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Nombre</th>
                        <th>Sección</th>
                        <th>Horario</th>
                        <th>ID (QR)</th>
                        <th class="admin-only">Acción</th>
                    </tr>
                </thead>
                <tbody id="scanned-list">
                </tbody>
            </table>
        </div>
    </main>

    <div id="notification-container">
        <div id="notification" class="toast"></div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE SEGURIDAD ---
        const MASTER_PIN = "2525"; // 🔑 CAMBIA AQUÍ TU CONTRASEÑA/PIN DE ADMINISTRADOR
        let isAdminActive = false;
        let adminTimer = null;

        // --- ESTADO GENERAL ---
        let isProcessing = false;
        let db = JSON.parse(localStorage.getItem('qrRegistros')) || [];
        let dbPersonal = JSON.parse(localStorage.getItem('dbPersonal')) || [];
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        if(dbPersonal.length > 0) {
            document.getElementById('btn-text').textContent = `BD Cargada (${dbPersonal.length} personas)`;
        }

        // --- SISTEMA DE AUTENTICACIÓN (LOCK / UNLOCK) ---
        function toggleAdminMode() {
            if (isAdminActive) {
                // Si ya está activo, se bloquea manualmente de inmediato
                lockAdminMode();
                showNotification('Seguridad activada. Modo Kiosco.', 'info');
            } else {
                // Solicitar PIN de acceso
                const inputPin = prompt("Introduce el PIN de Administrador para desbloquear funciones:");
                if (inputPin === MASTER_PIN) {
                    unlockAdminMode();
                    showNotification('🔓 Modo Administrador Activado', 'success');
                } else if (inputPin !== null) {
                    playSound('error');
                    showNotification('❌ PIN Incorrecto. Acceso denegado.', 'error');
                }
            }
        }

        function unlockAdminMode() {
            isAdminActive = true;
            
            // Actualizar botón de estado
            const btn = document.getElementById('admin-btn');
            btn.classList.add('active');
            document.getElementById('lock-icon').textContent = '🔓';
            document.getElementById('lock-text').textContent = 'Modo Admin';

            // Mostrar elementos ocultos usando estilos dinámicos
            document.querySelectorAll('.admin-only').forEach(el => {
                if(el.tagName === 'TH' || el.tagName === 'TD') {
                    el.style.setProperty('display', 'table-cell', 'important');
                } else if(el.tagName === 'LABEL' || el.tagName === 'BUTTON') {
                    el.style.setProperty('display', 'inline-block', 'important');
                } else {
                    el.style.setProperty('display', 'flex', 'important');
                }
            });

            updateTable(); // Re-renderizar tabla para mostrar botones de eliminación individuales
            resetAdminTimeout(); // Iniciar temporizador de auto-bloqueo
        }

        function lockAdminMode() {
            isAdminActive = false;
            clearTimeout(adminTimer); // Limpiar temporizador

            const btn = document.getElementById('admin-btn');
            btn.classList.remove('active');
            document.getElementById('lock-icon').textContent = '🔒';
            document.getElementById('lock-text').textContent = 'Modo Kiosco';

            // Volver a ocultar todo
            document.querySelectorAll('.admin-only').forEach(el => {
                el.style.setProperty('display', 'none', 'important');
            });

            updateTable(); // Re-renderizar tabla para ocultar las cruces de borrado
        }

        // Temporizador de seguridad por olvido (2 minutos)
        function resetAdminTimeout() {
            if (!isAdminActive) return;
            clearTimeout(adminTimer);
            adminTimer = setTimeout(() => {
                lockAdminMode();
                showNotification('🔒 Bloqueo automático por inactividad', 'info');
            }, 120000); // 120000 ms = 2 minutos
        }

        // Registrar interacciones para evitar que se bloquee mientras el admin la está usando
        document.addEventListener('click', resetAdminTimeout);
        document.addEventListener('keypress', resetAdminTimeout);


        // --- LÓGICA LECTOR EXTERNO (Pistola QR) ---
        let scanBuffer = '';
        let lastKeyTime = Date.now();

        document.addEventListener('keydown', function(e) {
            if (document.activeElement === document.getElementById('manual-input')) return;

            const currentTime = Date.now();
            if (currentTime - lastKeyTime > 50) {
                scanBuffer = '';
            }
            lastKeyTime = currentTime;

            if (e.key === 'Enter') {
                if (scanBuffer.length > 0) {
                    e.preventDefault();
                    onScanSuccess(scanBuffer);
                    scanBuffer = ''; 
                }
            } else {
                if (e.key.length === 1) {
                    scanBuffer += e.key;
                }
            }
        });

        // --- MANEJO INPUT MANUAL (SÓLO ADMIN TRAS VERIFICACIÓN) ---
        function processManualInput() {
            if(!isAdminActive) return;
            const inputElement = document.getElementById('manual-input');
            const value = inputElement.value.trim();
            if (value.length > 0) {
                onScanSuccess(value);
                inputElement.value = '';
            } else {
                showNotification('Por favor, ingresa un ID válido', 'error');
            }
        }

        document.getElementById('manual-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                processManualInput();
            }
        });

        // --- ELIMINACIÓN Y LIMPIEZA (SÓLO ADMIN) ---
        function deleteRecord(index) {
            if(!isAdminActive) return;
            if (confirm("¿Estás seguro de eliminar este marcaje de asistencia?")) {
                db.splice(index, 1);
                localStorage.setItem('qrRegistros', JSON.stringify(db));
                updateTable();
                showNotification('Registro eliminado con éxito', 'info');
            }
        }

        function clearAllRecords() {
            if(!isAdminActive) return;
            if (db.length === 0) {
                showNotification('El historial ya está vacío', 'info');
                return;
            }
            if (confirm("⚠️ ¿Deseas borrar TODOS los registros del día?")) {
                db = [];
                localStorage.setItem('qrRegistros', JSON.stringify(db));
                updateTable();
                showNotification('Historial completamente vaciado', 'error');
            }
        }

        // --- MANEJO DE EXCEL ---
        document.getElementById('excel-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheet];
                    const jsonResult = XLSX.utils.sheet_to_json(worksheet);
                    
                    if(jsonResult.length > 0) {
                        dbPersonal = jsonResult;
                        localStorage.setItem('dbPersonal', JSON.stringify(dbPersonal));
                        document.getElementById('btn-text').textContent = `BD Cargada (${dbPersonal.length} personas)`;
                        showNotification(`¡Plantilla cargada con éxito!`, 'info');
                    } else {
                        showNotification('El archivo Excel está vacío', 'error');
                    }
                } catch (error) {
                    showNotification('Error al leer el archivo Excel', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function exportToExcel() {
            if (db.length === 0) {
                showNotification('No hay registros para exportar todavía', 'error');
                return;
            }

            const dataToExport = db.map(entry => ({
                'FECHA': entry.fecha,
                'HORA': entry.hora,
                'NOMBRE': entry.nombre || 'Desconocido',
                'SECCIÓN': entry.seccion || 'Sin Sección',
                'HORARIO': entry.horario || 'Sin Horario',
                'ID_QR': entry.id
            }));

            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Asistencia");

            const fechaHoy = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(workbook, `Reporte_Asistencia_${fechaHoy}.xlsx`);
            showNotification('📊 Excel generado y descargado', 'success');
        }

        // --- FEEDBACK Y UI ---
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'success') {
                oscillator.type = 'square';
                oscillator.frequency.value = 900;
                oscillator.start();
                setTimeout(() => oscillator.stop(), 150);
            } else if (type === 'error') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.value = 250;
                oscillator.start();
                setTimeout(() => oscillator.stop(), 400);
            }
        }

        function showNotification(message, type) {
            const notif = document.getElementById('notification');
            const visualWrapper = document.getElementById('scanner-visuals');
            
            notif.textContent = message;
            notif.className = `toast ${type}`;
            notif.style.display = 'block';

            visualWrapper.classList.add(type);
            
            setTimeout(() => {
                notif.style.display = 'none';
                visualWrapper.classList.remove(type);
            }, 3000);
        }

        function updateTable() {
            const tbody = document.getElementById('scanned-list');
            tbody.innerHTML = ''; 
            
            for (let i = db.length - 1; i >= 0; i--) {
                const entry = db[i];
                const tr = document.createElement('tr');
                const seccionMostrar = entry.seccion ? `<span class="tag-seccion">${entry.seccion}</span>` : "-";
                
                // La celda de la cruz de borrado hereda la clase admin-only y se rige por el estado actual
                const displayDeleteCell = isAdminActive ? 'style="display: table-cell !important;"' : '';

                tr.innerHTML = `
                    <td>${entry.hora}</td>
                    <td><strong>${entry.nombre || "-"}</strong></td>
                    <td>${seccionMostrar}</td>
                    <td>${entry.horario || "-"}</td>
                    <td style="color:#666;">${entry.id}</td>
                    <td class="admin-only" ${displayDeleteCell}><button class="btn-delete-row" onclick="deleteRecord(${i})" title="Eliminar Registro">❌</button></td>
                `;
                tbody.appendChild(tr);
            }
        }

        // --- FUNCIÓN CENTRAL DE PROCESAMIENTO ---
        function onScanSuccess(decodedText) {
            if (isProcessing) return; 
            
            isProcessing = true;
            setTimeout(() => isProcessing = false, 1500); 

            const now = new Date();
            const fechaActual = now.toLocaleDateString('es-CL'); 
            const horaActual = now.toLocaleTimeString('es-CL');

            const yaRegistrado = db.find(reg => reg.id === decodedText && reg.fecha === fechaActual);

            if (yaRegistrado) {
                playSound('error');
                showNotification(`⚠️ Ya registrado hoy: ${yaRegistrado.nombre}`, 'error');
                return;
            }

            const empleado = dbPersonal.find(p => String(p.ID || p.id || p.Id) === String(decodedText));
            
            const nuevoRegistro = {
                id: decodedText,
                nombre: empleado ? (empleado.NOMBRE || empleado.Nombre || empleado.nombre) : "Desconocido",
                seccion: empleado ? (empleado.SECCION || empleado.Seccion || empleado.SECCIÓN || empleado.Sección) : "Sin Sección",
                horario: empleado ? (empleado.HORARIO || empleado.Horario) : "Sin Horario",
                fecha: fechaActual,
                hora: horaActual
            };

            db.push(nuevoRegistro);
            localStorage.setItem('qrRegistros', JSON.stringify(db));
            updateTable();
            playSound('success');
            
            if (empleado) {
                showNotification(`✅ Ingreso: ${nuevoRegistro.nombre}`, 'success');
            } else {
                showNotification(`✅ ID Registrado: ${decodedText}`, 'info');
            }
        }

        // --- INICIALIZACIÓN ---
        document.addEventListener("DOMContentLoaded", function() {
            updateTable();

            let html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 15, qrbox: {width: 250, height: 250}, aspectRatio: 1.0 },
                false);
            html5QrcodeScanner.render(onScanSuccess, () => {});
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
