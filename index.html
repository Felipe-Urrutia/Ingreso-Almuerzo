<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pro - Control Asistencia</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-deep: #121212; 
            --bg-panel: #1e1e1e; 
            --primary-glow: #00ff88; 
            --error-glow: #ff0055;
            --info-glow: #00bfff; 
            --text-main: #e0e0e0;
            --text-muted: #888;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(5px);
            position: fixed;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin: 0;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 2px;
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: none;
        }
        
        .custom-file-upload {
            border: 1px solid var(--info-glow);
            color: var(--info-glow);
            background-color: transparent;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .custom-file-upload:hover {
            background-color: rgba(0, 191, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.4);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin-top: 110px; 
            padding-bottom: 20px;
        }

        .scanner-wrapper {
            width: 90%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            background-color: var(--bg-panel);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            border: 2px solid #333;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .scanner-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 255, 136, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
            animation: scanningLine 2.5s infinite linear;
            z-index: 10;
        }

        @keyframes scanningLine {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        #reader {
            width: 100% !important;
            border: none !important;
            text-align: center;
        }
        
        #reader video {
            width: 100% !important;
            height: auto !important;
            object-fit: cover !important;
            display: block !important;
            margin: 0 auto !important;
            border-radius: 18px;
        }

        #reader__dashboard_section_csr button {
            background-color: var(--bg-deep);
            color: var(--primary-glow);
            border: 1px solid var(--primary-glow);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8em;
            margin: 10px auto;
            display: block;
        }
        
        #reader__status_span { color: var(--text-muted) !important; font-size: 0.8em;}
        #reader img { opacity: 0.3; margin: 0 auto; }

        .scanner-wrapper.success {
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.6);
            border-color: var(--primary-glow);
        }

        .scanner-wrapper.error {
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.6);
            border-color: var(--error-glow);
        }

        .scanner-wrapper.info {
            box-shadow: 0 0 50px rgba(0, 191, 255, 0.6);
            border-color: var(--info-glow);
        }

        #notification-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .toast {
            background-color: var(--bg-panel);
            color: var(--text-main);
            padding: 15px 25px;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: none;
            border-left: 5px solid transparent;
            min-width: 250px;
            font-weight: bold;
        }

        .toast.success { border-left-color: var(--primary-glow); }
        .toast.error { border-left-color: var(--error-glow); }
        .toast.info { border-left-color: var(--info-glow); }

        .results-container {
            width: 90%;
            max-width: 650px;
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            margin-top: 25px;
            overflow-x: auto;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .results-header h3 {
            margin: 0;
            color: var(--text-muted);
            font-size: 1em;
            text-transform: uppercase;
        }

        /* Botón de descarga de Excel */
        .btn-download {
            background-color: transparent;
            border: 1px solid var(--primary-glow);
            color: var(--primary-glow);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            background-color: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }

        th {
            color: var(--text-muted);
            font-weight: normal;
            text-align: left;
            padding: 8px;
            white-space: nowrap;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid #2a2a2a;
        }

        td strong { color: var(--text-main); }
        tr:last-child td { border-bottom: none; }
        
        .tag-seccion {
            background: #333;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.85em;
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <h2>Scanner Pro</h2>
        <div class="subtitle">Aprendiendo y registrando cada día</div>
        
        <label for="excel-upload" class="custom-file-upload">
            <span id="btn-text">Cargar BD Personal (.xlsx)</span>
        </label>
        <input id="excel-upload" type="file" accept=".xlsx, .xls" />
    </header>

    <main>
        <div class="scanner-wrapper" id="scanner-visuals">
            <div id="reader"></div>
        </div>

        <div class="results-container">
            <div class="results-header">
                <h3>Registros de Hoy</h3>
                <button class="btn-download" onclick="exportToExcel()">Descargar Reporte</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Nombre</th>
                        <th>Sección</th>
                        <th>Horario</th>
                        <th>ID (QR)</th>
                    </tr>
                </thead>
                <tbody id="scanned-list">
                </tbody>
            </table>
        </div>
    </main>

    <div id="notification-container">
        <div id="notification" class="toast"></div>
    </div>

    <script>
        let isProcessing = false;
        let db = JSON.parse(localStorage.getItem('qrRegistros')) || [];
        let dbPersonal = JSON.parse(localStorage.getItem('dbPersonal')) || [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        if(dbPersonal.length > 0) {
            document.getElementById('btn-text').textContent = `BD Cargada (${dbPersonal.length} personas)`;
        }

        document.getElementById('excel-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheet];
                    const jsonResult = XLSX.utils.sheet_to_json(worksheet);
                    
                    if(jsonResult.length > 0) {
                        dbPersonal = jsonResult;
                        localStorage.setItem('dbPersonal', JSON.stringify(dbPersonal));
                        document.getElementById('btn-text').textContent = `BD Cargada (${dbPersonal.length} personas)`;
                        showNotification(`¡Plantilla cargada con éxito!`, 'info');
                    } else {
                        showNotification('El archivo Excel está vacío', 'error');
                    }
                } catch (error) {
                    showNotification('Error al leer el archivo Excel', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // NUEVA FUNCIÓN PARA EXPORTAR LA BASE DE DATOS LOCAL A EXCEL
        function exportToExcel() {
            if (db.length === 0) {
                showNotification('No hay registros para exportar todavía', 'error');
                return;
            }

            // Mapeamos los datos acumulados a un formato limpio para el Excel
            const dataToExport = db.map(entry => ({
                'FECHA': entry.fecha,
                'HORA': entry.hora,
                'NOMBRE': entry.nombre || 'Desconocido',
                'SECCIÓN': entry.seccion || 'Sin Sección',
                'HORARIO': entry.horario || 'Sin Horario',
                'ID_QR': entry.id
            }));

            // Creamos el libro de trabajo de Excel en memoria
            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Asistencia_Historica");

            // Generar nombre automático basado en la fecha de la descarga
            const fechaHoy = new Date().toISOString().slice(0, 10);
            const nombreArchivo = `Reporte_Asistencia_${fechaHoy}.xlsx`;

            // Forzar la descarga en el navegador del usuario
            XLSX.writeFile(workbook, nombreArchivo);
            showNotification('📊 Excel generado y descargado', 'success');
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            gainNode.gain.value = 1; 

            if (type === 'success') {
                oscillator.type = 'square';
                oscillator.frequency.value = 900;
                oscillator.start();
                setTimeout(() => oscillator.stop(), 150);
            } else if (type === 'error') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.value = 250;
                oscillator.start();
                setTimeout(() => oscillator.stop(), 400);
            }
        }

        function showNotification(message, type) {
            const notif = document.getElementById('notification');
            const visualWrapper = document.getElementById('scanner-visuals');
            
            notif.textContent = message;
            notif.className = `toast ${type}`;
            notif.style.display = 'block';

            visualWrapper.classList.add(type);
            
            setTimeout(() => {
                notif.style.display = 'none';
                visualWrapper.classList.remove(type);
            }, 3500);
        }

        function updateTable() {
            const tbody = document.getElementById('scanned-list');
            tbody.innerHTML = ''; 
            
            const reversedDb = [...db].reverse(); 
            
            reversedDb.forEach(entry => {
                const tr = document.createElement('tr');
                
                const nombreMostrar = entry.nombre ? entry.nombre : "-";
                const seccionMostrar = entry.seccion ? `<span class="tag-seccion">${entry.seccion}</span>` : "-";
                const horarioMostrar = entry.horario ? entry.horario : "-";

                tr.innerHTML = `
                    <td>${entry.hora}</td>
                    <td><strong>${nombreMostrar}</strong></td>
                    <td>${seccionMostrar}</td>
                    <td>${horarioMostrar}</td>
                    <td style="color:#666;">${entry.id}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return; 
            
            isProcessing = true;
            setTimeout(() => isProcessing = false, 2000); 

            const now = new Date();
            const fechaActual = now.toLocaleDateString('es-CL'); 
            const horaActual = now.toLocaleTimeString('es-CL');

            const yaRegistrado = db.find(registro => registro.id === decodedText && registro.fecha === fechaActual);

            if (yaRegistrado) {
                playSound('error');
                showNotification(`⚠️ Ya registrado hoy.`, 'error');
                return;
            }

            playSound('success');
            
            const empleado = dbPersonal.find(persona => String(persona.ID || persona.id || persona.Id) === String(decodedText));
            
            let nombrePersona = "Desconocido";
            let seccionPersona = "Sin Sección";
            let horarioPersona = "Sin Horario";

            if (empleado) {
                nombrePersona = empleado.NOMBRE || empleado.Nombre || empleado.nombre || "Sin Nombre";
                seccionPersona = empleado.SECCION || empleado.Seccion || empleado.seccion || empleado.SECCIÓN || empleado.Sección || empleado.sección || "Sin Sección";
                horarioPersona = empleado.HORARIO || empleado.Horario || empleado.horario || "Sin Horario";
            }

            const nuevoRegistro = {
                id: decodedText,
                nombre: nombrePersona,
                seccion: seccionPersona,
                horario: horarioPersona,
                fecha: fechaActual,
                hora: horaActual
            };

            db.push(nuevoRegistro);
            localStorage.setItem('qrRegistros', JSON.stringify(db));

            updateTable();
            
            if (empleado) {
                showNotification(`✅ Ingreso: ${nombrePersona}`, 'success');
            } else {
                showNotification(`✅ QR Guardado (Sin datos en BD)`, 'info');
            }
        }

        function onScanFailure(error) {}

        document.addEventListener("DOMContentLoaded", function() {
            updateTable();

            let html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { 
                    fps: 15,
                    qrbox: {width: 250, height: 250},
                    aspectRatio: 1.0 
                },
                false);
                
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        });
    </script>
</body>
</html>
