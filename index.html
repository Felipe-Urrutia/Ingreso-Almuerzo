<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pro - Control Asistencia</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-deep: #121212; 
            --bg-panel: #1e1e1e; 
            --primary-glow: #00ff88; 
            --error-glow: #ff0055; 
            --text-main: #e0e0e0;
            --text-muted: #888;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(5px);
            position: fixed;
            top: 0;
            z-index: 100;
        }

        h2 {
            margin: 0;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 2px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Cambiado para mejor alineación en móviles */
            width: 100%;
            margin-top: 100px; /* Más espacio para la cabecera */
            padding-bottom: 20px;
        }

        /* CONTENEDOR DEL ESCÁNER CORREGIDO */
        .scanner-wrapper {
            width: 90%;
            max-width: 500px;
            margin: 0 auto; /* Centrado absoluto */
            position: relative;
            background-color: var(--bg-panel);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            border: 2px solid #333;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .scanner-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 255, 136, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
            animation: scanningLine 2.5s infinite linear;
            z-index: 10;
        }

        @keyframes scanningLine {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* FORZAR CENTRADO DEL VIDEO INTERNO */
        #reader {
            width: 100% !important;
            border: none !important;
            text-align: center;
        }
        
        #reader video {
            width: 100% !important;
            height: auto !important;
            object-fit: cover !important; /* Evita que se deforme */
            display: block !important;
            margin: 0 auto !important; /* Centra el video */
            border-radius: 18px; /* Encaja con los bordes externos */
        }

        #reader__dashboard_section_csr button {
            background-color: var(--bg-deep);
            color: var(--primary-glow);
            border: 1px solid var(--primary-glow);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8em;
            margin: 10px auto;
            display: block;
        }
        
        #reader__status_span { color: var(--text-muted) !important; font-size: 0.8em;}
        #reader img { opacity: 0.3; margin: 0 auto; }

        .scanner-wrapper.success {
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.6);
            border-color: var(--primary-glow);
        }

        .scanner-wrapper.error {
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.6);
            border-color: var(--error-glow);
        }

        #notification-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .toast {
            background-color: var(--bg-panel);
            color: var(--text-main);
            padding: 15px 25px;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: none;
            border-left: 5px solid transparent;
            min-width: 250px;
            font-weight: bold;
        }

        .toast.success { border-left-color: var(--primary-glow); }
        .toast.error { border-left-color: var(--error-glow); }

        .results-container {
            width: 90%;
            max-width: 500px;
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            margin-top: 25px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .results-header h3 {
            margin: 0;
            color: var(--text-muted);
            font-size: 1em;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }

        th {
            color: var(--text-muted);
            font-weight: normal;
            text-align: left;
            padding: 8px;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid #2a2a2a;
        }

        td strong { color: var(--text
