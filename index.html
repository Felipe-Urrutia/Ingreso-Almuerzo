<!DOCTYPE html>
<html lang="es-CL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia Casino Jumbo</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/html5-qrcode.min.js"></script>
    <script src="js/xlsx.style.min.js"></script>
</head>

<body>

    <header>
        <h1>Control de Asistencia - Jumbo</h1>
    </header>

    <main>
        <div id="scanner-visuals" class="wrapper">
            <div id="reader"></div>
            <div id="notification" class="toast" style="display: none;"></div>
        </div>

        <section id="admin-panel" class="admin-section">
            <input type="file" id="excel-upload" accept=".xlsx, .xls">
            <button id="btn-text">Cargar BD Personal</button>
            <button id="btn-export" onclick="exportToExcel()">Exportar Excel Analítico</button>
            <button id="btn-clear" onclick="clearAllRecords()">Vaciar Todo</button>
            <input type="password" id="pin-input" placeholder="PIN Admin">
        </section>

        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Colaborador</th>
                        <th>Sección</th>
                        <th>Horario</th>
                        <th>ID / RUT</th>
                        <th class="admin-only">Acciones</th>
                    </tr>
                </thead>
                <tbody id="scanned-list">
                </tbody>
            </table>
        </section>
    </main>

    <script src="js/excel.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
