<!DOCTYPE html>
<html lang="es-CL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Jumbo</title>

    <link rel="shortcut icon" type="image/png" href="./img/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./img/icon-192.png">
    <link rel="apple-touch-icon" href="./img/icon-192.png">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="./css/style.css">

    <script src="./js/html5-qrcode.min.js"></script>
    <script src="./js/xlsx.style.min.js"></script>
</head>

<body>

    <header>
        <div class="logo-jumbo" onclick="clickSecretoAdmin()" style="cursor: pointer; user-select: none;"></div>
        <h1>Control de Asistencia - Jumbo</h1>
    </header>
    <main>
        <div id="scanner-visuals" class="wrapper">
            <div id="reader"></div>
            <div id="notification" class="toast" style="display: none;"></div>
        </div>

        <div class="admin-section">

            <div class="admin-only" style="display: none;">
                <label for="excel-upload" class="custom-file-upload">
                    📂 Cargar Base de Datos (Excel)
                </label>
                <input type="file" id="excel-upload" accept=".xlsx, .xls" style="display: none;">
            </div>

            <button id="btn-export" onclick="exportToExcel()">📊 Exportar Asistencia (Excel)</button>

            <div class="admin-only" style="display: none;">
                <button id="btn-clear" onclick="clearAllRecords()">⚠️ Vaciar Historial del Día</button>
            </div>
        </div>

        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Colaborador</th>
                        <th>Sección</th>
                        <th>Horario</th>
                        <th>ID / RUT</th>
                        <th class="admin-only">Acciones</th>
                    </tr>
                </thead>
                <tbody id="scanned-list">
                </tbody>
            </table>
        </section>
    </main>

    <div id="custom-admin-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Autenticación de Seguridad</h3>
            <p>Ingrese credencial de supervisor para acceder:</p>
            <input type="password" id="modal-pin" placeholder="••••" maxlength="6" autocomplete="off">
            <div class="modal-buttons">
                <button class="btn-modal-cancel" onclick="cerrarModalSecreto()">Cancelar</button>
                <button class="btn-modal-confirm" onclick="verificarPinModal()">Ingresar</button>
            </div>
        </div>
    </div>

    <script src="./js/excel.js"></script>
    <script src="./js/scanner.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
