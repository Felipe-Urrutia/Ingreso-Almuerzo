<!DOCTYPE html>
<html lang="es-CL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Casino Jumbo</title>

    <link rel="shortcut icon" type="image/png" href="./img/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./img/icon-192.png">
    <link rel="apple-touch-icon" href="./img/icon-192.png">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="./css/style.css">

    <script src="./js/xlsx.style.min.js"></script>
</head>

<body>

    <header>
        <div class="logo-jumbo" onclick="clickSecretoAdmin()" style="cursor: pointer; user-select: none;"></div>
        <h1>Control de Asistencia - Jumbo</h1>
    </header>

    <main class="app-container main-content-layout">

        <div class="bloque-izquierdo" style="width: 100%;">

            <div class="control-camara" style="margin-bottom: 10px;">
                <label for="selector-camaras"
                    style="font-size: 0.85rem; font-weight: 600; color: var(--texto-oscuro); display: block; margin-bottom: 4px;">📸
                    Seleccionar Cámara:</label>
                <select id="selector-camaras"
                    style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--borde); font-size: 0.9rem; background-color: #f8fafc; color: var(--texto-oscuro);">
                    <option value="">Cargando cámaras...</option>
                </select>
            </div>

            <div id="scanner-visuals" class="wrapper">
                <div id="reader"></div>
                <div id="notification" class="toast" style="display: none;"></div>
            </div>

            <div class="admin-section">
                <div class="admin-only" style="display:none;">
                    <label for="excel-file" class="custom-file-upload">📁 Cargar Base de Personal</label>
                    <input type="file" id="excel-file" accept=".xlsx, .xls" onchange="cargarBasePersonal(event)"
                        style="display: none;">
                </div>

                <button id="btn-export" onclick="exportToExcel()">📊 Exportar Asistencia (Excel)</button>

                <div class="admin-only" style="display: none;">
                    <button id="btn-clear" onclick="clearAllRecords()">⚠️ Vaciar Historial del Día</button>
                </div>
            </div>

        </div>
        <section class="table-container">
            <h2>📋 Personal Registrado</h2>
            <div class="contenedor-tarjetas" id="scanned-list">
            </div>
        </section>

    </main>

    <div id="custom-admin-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Autenticación de Seguridad</h3>
            <p>Ingrese credencial de supervisor para acceder:</p>
            <input type="password" id="modal-pin" placeholder="••••" maxlength="6" autocomplete="off">
            <div class="modal-buttons">
                <button class="btn-modal-confirm" onclick="verificarPinModal()">Ingresar</button>
                <button class="btn-modal-cancel" onclick="cerrarModalSecreto()">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="custom-confirm-modal" class="modal-overlay">
        <div class="modal-content" style="border-top: 4px solid var(--rojo-alerta);">
            <h3>⚠️ ¿Vaciar Historial?</h3>
            <p>Esta acción eliminará de forma permanente TODOS los marcajes del día. No se puede deshacer.</p>
            <div class="modal-buttons">
                <button class="btn-modal-confirm"
                    style="background-color: var(--rojo-alerta) !important; box-shadow: 0 4px 12px rgba(231, 76, 60, 0.2);"
                    onclick="ejecutarVaciadoReal()">Sí, Borrar Todo</button>
                <button class="btn-modal-cancel" onclick="cerrarConfirmModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="./js/html5-qrcode.min.js"></script>

    <script src="./js/scanner.js"></script>

    <script src="./js/excel.js"></script>

    <script src="./js/main.js"></script>
</body>

</html>
