<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personal QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #18bc9c;
            --danger: #e74c3c;
            --bg-color: #ecf0f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        h2 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        #reader {
            width: 100%;
            max-width: 450px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
            border: 3px solid var(--primary);
        }
        #notification {
            width: 100%;
            max-width: 410px;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            display: none;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .results-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .badge-success { background-color: var(--secondary); }
        .badge-error { background-color: var(--danger); }
    </style>
</head>
<body>

    <h2>Control de Asistencia QR</h2>
    <div class="subtitle">Siempre dispuesto a aprender y mejorar el sistema</div>
    
    <div id="reader"></div>

    <div id="notification"></div>

    <div class="results-container">
        <h3 style="margin-top:0; color: var(--primary);">Registros de Hoy</h3>
        <table>
            <thead>
                <tr>
                    <th>Identificador (QR)</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                </tr>
            </thead>
            <tbody id="scanned-list">
                </tbody>
        </table>
    </div>

    <script>
        let lastScannedText = "";
        let isProcessing = false;
        let db = JSON.parse(localStorage.getItem('qrRegistros')) || [];

        // Generador de sonidos usando Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            // Reanudar el contexto de audio (necesario por las políticas de los navegadores)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // Ajustar volumen al máximo (1)
            gainNode.gain.value = 1;

            if (type === 'success') {
                // Sonido agudo, penetrante y rápido para éxito
                oscillator.type = 'square';
                oscillator.frequency.value = 900; // Frecuencia alta
                oscillator.start();
                setTimeout(() => oscillator.stop(), 150); // Dura 150ms
            } else if (type === 'error') {
                // Sonido más grave y largo para error/duplicado
                oscillator.type = 'sawtooth';
                oscillator.frequency.value = 250; // Frecuencia baja
                oscillator.start();
                setTimeout(() => oscillator.stop(), 400); // Dura 400ms
            }
        }

        function showNotification(message, type) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = type === 'success' ? 'badge-success' : 'badge-error';
            notif.style.display = 'block';
            
            setTimeout(() => {
                notif.style.display = 'none';
            }, 4000);
        }

        function updateTable() {
            const tbody = document.getElementById('scanned-list');
            tbody.innerHTML = ''; 
            const reversedDb = [...db].reverse(); 
            
            reversedDb.forEach(entry => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${entry.id}</strong></td>
                    <td>${entry.fecha}</td>
                    <td>${entry.hora}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return; 
            
            isProcessing = true;
            setTimeout(() => isProcessing = false, 2000); 

            const now = new Date();
            const fechaActual = now.toLocaleDateString('es-CL'); 
            const horaActual = now.toLocaleTimeString('es-CL');

            const yaRegistrado = db.find(registro => registro.id === decodedText && registro.fecha === fechaActual);

            if (yaRegistrado) {
                playSound('error');
                showNotification(`⚠️ El usuario ${decodedText} ya registró asistencia hoy.`, 'error');
                return;
            }

            // Registro exitoso
            playSound('success');
            
            const nuevoRegistro = {
                id: decodedText,
                fecha: fechaActual,
                hora: horaActual
            };

            db.push(nuevoRegistro);
            localStorage.setItem('qrRegistros', JSON.stringify(db));

            updateTable();
            showNotification(`✅ Registro exitoso: ${decodedText}`, 'success');
        }

        function onScanFailure(error) {
            // Ignorar errores de frames vacíos
        }

        document.addEventListener("DOMContentLoaded", function() {
            updateTable();

            let html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 10, qrbox: {width: 250, height: 250} },
                false);
                
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        });
    </script>
</body>
</html>
